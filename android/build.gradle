buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.findProperty(prop) ?: fallback
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${safeExtGet('androidGradlePluginVersion', '8.1.1')}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.8.22')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.reactnativepdfannotation'
    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 23)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        consumerProguardFiles "proguard-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(safeExtGet('javaTargetVersion', '17'))
        targetCompatibility JavaVersion.toVersion(safeExtGet('javaTargetVersion', '17'))
    }

    kotlinOptions {
        jvmTarget = safeExtGet('javaTargetVersion', '17')
    }

    testOptions {
        unitTests.includeAndroidResources = false
    }

    // 排除 libc++_shared.so。React Native 0.72 及以上已提供该库，重复打包会在 mergeNativeLibs 冲突。
    packagingOptions {
        exclude 'lib/arm64-v8a/libc++_shared.so'
        exclude 'lib/armeabi-v7a/libc++_shared.so'
        exclude 'lib/x86/libc++_shared.so'
        exclude 'lib/x86_64/libc++_shared.so'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android:${safeExtGet('reactNativeVersion', '+')}"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
